[project]
name = "fairshare"
version = "0.1.0"
description = "Fair-share rate limiting client: talks to Redis directly and runs the same Lua scripts as the rate limiter service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["redis>=5"]

[project.optional-dependencies]
test = ["pytest>=8", "starlette>=0.40", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fairshare"]

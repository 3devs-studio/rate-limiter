[package]
name = "fairshare"
version = "0.1.0"
edition = "2021"
description = "Fair-share rate limiting client: talks to Redis directly and runs the same Lua scripts as the rate limiter service."
license = "MIT"

[dependencies]
redis = { version = "0.27", features = ["tokio-comp", "script"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync"] }
axum = { version = "0.8", optional = true, default-features = false }
http = { version = "1", optional = true }

[features]
default = []
axum = ["dep:axum", "dep:http"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
